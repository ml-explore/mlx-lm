name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/head/main' }}

jobs:
  check_lint:
    if: github.repository == 'ml-explore/mlx-lm'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.1

  mac_build_and_test:
    if: github.repository == 'ml-explore/mlx-lm'
    runs-on: [self-hosted, macos]
    needs: check_lint
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-macos
      - name: Install test dependencies
        shell: bash -l {0}
        run: |
          pip install unittest-xml-reporting
          pip install -e ".[test]"
      - name: Debug tokenizer state
        shell: bash -l {0}
        run: |
          python -c "
          import transformers
          from transformers import AutoTokenizer
          print('transformers version:', transformers.__version__)
          for repo in ['mlx-community/Llama-3.2-1B-Instruct-4bit', 'mlx-community/Falcon3-7B-Instruct-4bit']:
              print('---', repo, '---')
              t = AutoTokenizer.from_pretrained(repo)
              print('type:', type(t).__name__)
              print('clean_up_tokenization_spaces attr:', t.clean_up_tokenization_spaces)
              print('init_kwargs has key:', 'clean_up_tokenization_spaces' in t.init_kwargs)
              print('init_kwargs value:', t.init_kwargs.get('clean_up_tokenization_spaces'))
              encoded = t.encode('a ,b')
              print('encoded:', encoded)
              print('decode default:', repr(t.decode(encoded)))
              print('decode clean=True:', repr(t.decode(encoded, clean_up_tokenization_spaces=True)))
              print('decode clean=False:', repr(t.decode(encoded, clean_up_tokenization_spaces=False)))
          "
      - name: Run tests
        shell: bash -l {0}
        run: |
          curl -o test_data.zip -L https://github.com/ml-explore/mlx-lm/releases/download/test_data/test_data.zip
          unzip test_data.zip
          METAL_DEVICE_WRAPPER_TYPE=1 METAL_DEBUG_ERROR_MODE=0 HF_HOME="." python -m xmlrunner discover -v tests -o test-results/
          mlx.launch -n 2 tests/model_parallel_tests.py
