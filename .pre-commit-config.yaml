repos:
-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
    -   id: black
-   repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
    -   id: isort
        args:
            - --profile=black
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
    -   id: ruff-check
